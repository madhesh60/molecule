[project]
name = "molecule-mcp"
version = "0.2.0"
description = "Local-first context router and cross-session memory for AI agents — MCP server + Python API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "ai", "agent", "memory", "context", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",                # works with both 1.x (FastMCP) and 2.x (MCPServer)
    "numpy>=1.24.0",
    "tiktoken>=0.5.0",
    "onnxruntime>=1.16.0",       # runs the embedding model — no PyTorch needed
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/rajmadhesh/molecule"
Documentation = "https://github.com/rajmadhesh/molecule#readme"
Issues = "https://github.com/rajmadhesh/molecule/issues"

[project.scripts]
molecule = "molecule.cli:main"

[project.optional-dependencies]
# Only for embedding models that ship no ONNX export.
torch = ["sentence-transformers>=2.2.0"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molecule = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: slow integration tests (real model + real files)",
    "model: needs the real embedding model (skipped when it is not cached)",
]
