name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-onnx-${{ runner.os }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download the model once
        run: molecule setup
      - name: Lint
        run: ruff check .
      - name: Test (includes real-model accuracy gates)
        run: pytest -q
        env:
          PYTHONUTF8: "1"

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-onnx-${{ runner.os }}
      - run: pip install -e ".[dev]" && molecule setup
      - name: Definition of Done (AGENTS.md §15)
        run: python verify_efficiency.py
      - name: Benchmarks
        run: python benchmarks/run_benchmarks.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/RESULTS.md
